<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Estilizado</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">
        <h2>Cadastro de Informações Pessoais</h2>


        <form action="insert-clientes.php" method="post">
            <label for="nome_usuario">Nome de usuário:</label>
            <input type="text" id="nome_usuario" name="nm_usuario" required>

            <label for="nome_login">Nome de login:</label>
            <input type="text" id="nome_login" name="nm_login" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="ds_email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="ds_password" required>

            <button type="submit">Cadastrar</button>
            <a class="btn-consultar" href="login.html">Login</a>
        </form>
    </div>

</body>

</html>
